services:
  postgres:
    image: postgres:16-alpine
    container_name: kite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kite
      POSTGRES_PASSWORD: kite
      POSTGRES_DB: kite
    ports:
      - "5432:5432"
    volumes:
      - kite_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kite -d kite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kite_pg:
